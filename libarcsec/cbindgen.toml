# cbindgen configuration for include/arcsec.h. The header is committed and a test
# (`cargo test -p libarcsec header`) fails if it differs from what this generates;
# regenerate with `ARCSEC_BLESS=1 cargo test -p libarcsec header`.

language = "C"
include_guard = "ARCSEC_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
line_length = 100
# Always LF: the default ("Auto") gives CRLF on Windows, and the header test
# compares byte for byte.
line_endings = "LF"
tab_width = 4

header = """
/*
 * arcsec.h - C interface to the arcsec plate solver (libarcsec).
 *
 * Generated by cbindgen from libarcsec/src; do not edit by hand.
 * Documentation: libarcsec/README.md and https://cruzzil.github.io/arcsec/c-library/
 *
 * SPDX-License-Identifier: MIT
 */"""

after_includes = """
/* Link against libarcsec (pkg-config: arcsec). Every function is thread-safe
 * unless its documentation says otherwise; see README.md for the threading,
 * ownership and versioning rules. */"""

[export]
# Enums documented as the values of plain integer fields and arguments, which no
# signature names, so cbindgen would otherwise leave them out.
include = ["arcsec_pixel_type", "arcsec_log_level"]

[enum]
# Variants already carry the ARCSEC_ prefix.
rename_variants = "None"

[fn]
args = "auto"
