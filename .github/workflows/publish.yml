name: Publish to crates.io

# Manual only. Run it from the Actions tab after the release tag exists, choosing the
# tag (not a branch) in "Use workflow from". Leave "dry run" ticked first to see what
# would be uploaded.
#
# Authenticates by crates.io trusted publishing: no API token is stored. The job asks
# GitHub for an OIDC identity token, crates.io checks it against each crate's trusted
# publisher (this repository, this workflow file, the "crates-io" environment) and
# returns a short-lived publish token, which is revoked when the job ends. Each of the
# five crates needs that trusted publisher added under its Settings on crates.io; see
# CONTRIBUTING.md. Renaming this file or the environment breaks the match.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry run (package and verify, upload nothing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish arcsec-core, then arcsec-io and arcsec-catalogue, then arcsec and libarcsec
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # the OIDC token that crates.io exchanges for a publish token
    steps:
      - name: Refuse to publish from a branch
        if: ${{ !inputs.dry-run && github.ref_type != 'tag' }}
        run: |
          echo "::error::publish from a release tag, not ${{ github.ref_name }}"
          exit 1

      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # `--workspace` publishes in dependency order - arcsec-core first - and waits for
      # each crate to reach the index before publishing the one that depends on it. A
      # dry run packages arcsec-core into a temporary local registry so the CLI can be
      # verified against it before it is on crates.io.
      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: cargo publish --workspace --locked --dry-run

      # Fetched last, just before it is needed: the token is short-lived, and the
      # action's post step revokes it when the job finishes.
      - name: Authenticate with crates.io
        if: ${{ !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
