name: CI

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

# A newer push to the same branch or PR makes the running workflow moot. Runs on main
# are left to finish so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# Toolchains are installed explicitly per job. Lint and tests run on current stable,
# which is what contributors use and what `cargo install` users most likely have. The
# MSRV job builds and tests on the exact `rust-version` from Cargo.toml, read from
# there rather than repeated here. Nightly clippy runs as an advisory job only.

jobs:
  lint:
    name: Format, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # The workspace denies std_instead_of_core/alloc, so clippy is load-bearing
      # here rather than advisory: it is what keeps OS dependencies out of the
      # pure maths in arcsec-core.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked --verbose
      - name: Run tests
        run: cargo test --workspace --locked --verbose

      # N.I.N.A. reads the executable's FileVersion and, when it is missing, refuses
      # to run it with automatic downsampling (its default). build.rs embeds it and
      # only warns if it cannot, so assert it here.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Item target/debug/arcsec.exe).VersionInfo
          $v | Format-List FileVersion, ProductVersion, FileDescription
          if (-not $v.FileVersion) { throw "arcsec.exe has no FileVersion resource" }

      # The solver itself needs star catalogues and a corpus that are not in the
      # repo, so CI cannot check a solve. These paths need no data and are the
      # ones a user hits first when something is wrong.
      - name: Check the CLI surface
        shell: bash
        run: |
          set -euo pipefail
          run() { cargo run --quiet --locked --bin arcsec -- "$@"; }

          run --help > /dev/null
          run --version > /dev/null
          run catalog list > /dev/null
          run catalog path > /dev/null
          run catalog recommend --fov 2.5 > /dev/null

          # A header-only FITS: enough for the reader to accept the file, so the
          # exit-32 check below reaches the catalogue lookup instead of stopping
          # at "not an image".
          python3 - <<'PY'
          cards = ["SIMPLE  =                    T",
                   "BITPIX  =                    8",
                   "NAXIS   =                    2",
                   "NAXIS1  =                    4",
                   "NAXIS2  =                    4",
                   "END"]
          hdr = "".join(c.ljust(80) for c in cards).ljust(2880)
          open("tiny.fits", "wb").write(hdr.encode("ascii") + b"\0" * 2880)
          PY
          printf 'not an image' > not-an-image.dat

          # Exit codes are an ASTAP-compatible contract, and each of these has
          # been wrong at some point, so assert them rather than just running.
          expect() {
            local want=$1; shift
            local got=0
            "$@" > /dev/null 2>&1 || got=$?
            if [ "$got" != "$want" ]; then
              echo "expected exit $want, got $got, from: $*" >&2
              exit 1
            fi
          }
          expect 16 run -f /nonexistent/nope.fits
          expect 16 run -f not-an-image.dat
          expect 32 run -f tiny.fits -d /nonexistent/catalogs -D d50
          expect 1  run --sip -f tiny.fits
          rm -f tiny.fits not-an-image.dat

  # Nightly clippy, for lints that have not reached stable yet. Advisory: a failure
  # here shows up on the run but does not block a merge. Fix what it finds, or wait for
  # the lint to reach stable, where the lint job will enforce it.
  nightly-clippy:
    name: Clippy (nightly, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo +nightly clippy --workspace --all-targets --all-features --locked -- -D warnings

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          echo "MSRV is $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # --locked: the MSRV claim is about the committed lockfile. A dependency update
      # that needs a newer compiler fails here, and rust-version is then raised on
      # purpose rather than by accident.
      - name: Test
        run: cargo +${{ steps.msrv.outputs.version }} test --workspace --locked

  # Builds both crates from the files that would be uploaded, so a missing file or an
  # unpublishable manifest is caught before release day. `--workspace` packages
  # arcsec-core into a temporary local registry, so the CLI verifies against it even
  # before arcsec-core is on crates.io.
  package:
    name: Package for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo package --workspace --locked
      - name: List the packaged files
        run: |
          for crate in target/package/*.crate; do
            echo "$crate ($(du -h "$crate" | cut -f1))"
            tar tzf "$crate" | sed 's/^/  /'
          done
