name: Website

# Builds the website in site/ (Astro + Starlight) and deploys it to GitHub Pages.
#
# The home page's download button is filled in at build time from the latest GitHub
# release, so the site is rebuilt whenever a release is published as well as when
# site/ changes. Pull requests only build and check, never deploy.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  # A release published by hand. The Release workflow publishes with GITHUB_TOKEN, and
  # events caused by that token do not start other workflows, hence workflow_run too.
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run replaces a queued one but never cancels one
# that is already deploying.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build
    # After a Release run, only rebuild if it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Read-only use: fetching the latest release for the download links.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check internal links
        run: npm run check-links

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
