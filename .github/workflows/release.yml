name: Release

# Pushing a tag vX.Y.Z builds the CLI for each platform CI tests on and publishes a
# GitHub Release with the archives, SHA-256 checksums, and the CHANGELOG.md section
# for that version as its notes. Publishing to crates.io is separate and manual - see
# publish.yml and CONTRIBUTING.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check the tag and extract release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with Cargo.toml would publish binaries that report a
      # different version from their file names.
      - name: Check the tag matches the crate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          crate=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $tag does not match workspace version $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The notes are the body of "## [X.Y.Z] - date" up to the next "## [" heading.
      # A missing section fails the release: every version gets a changelog entry.
      - name: Extract the changelog section
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 rather than latest for the Linux builds: the binary needs the
          # glibc it was linked against or newer, and 22.04's (2.35) reaches more
          # distributions than 24.04's.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          # Static CRT, so the binary runs without the Visual C++ redistributable.
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip, rustflags: "-C target-feature=+crt-static" }
    env:
      # Set even when empty: RUSTFLAGS replaces the target rustflags in
      # .cargo/config.toml, whose --no-rosegment is a local profiling aid that
      # shipped binaries should not carry.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
      # Current stable, as CI tests with. The version used is printed in the log.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Show the toolchain
        run: rustc --version --verbose

      # The dist profile (Cargo.toml) is release without the debug info kept there
      # for profiling.
      - name: Build
        run: cargo build --profile dist --locked -p arcsec --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="arcsec-v${VERSION}-${{ matrix.target }}"
          exe=arcsec
          [ "${{ runner.os }}" = "Windows" ] && exe=arcsec.exe
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/dist/$exe" README.md LICENSE CHANGELOG.md "dist/$name/"
          # Smoke test the packaged binary itself, not the one cargo left behind.
          "dist/$name/$exe" --version
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the archives and write checksums
        run: |
          set -euo pipefail
          mkdir upload
          mv artifacts/build-*/* upload/
          cd upload
          # One combined list, plus a file per archive for single downloads.
          sha256sum arcsec-* > SHA256SUMS
          for f in arcsec-*; do sha256sum "$f" > "$f.sha256"; done
          cat SHA256SUMS

      # Signed build provenance, checkable with `gh attestation verify <file> -R cruzzil/arcsec`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            upload/arcsec-*.tar.gz
            upload/arcsec-*.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "arcsec $GITHUB_REF_NAME" \
            --notes-file artifacts/release-notes/release-notes.md \
            "${flags[@]}"
