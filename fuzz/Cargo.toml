# Fuzz targets for arcsec's file readers, run with cargo-fuzz on nightly:
#
#     cargo install cargo-fuzz
#     cargo +nightly fuzz run image_fits
#
# This crate is its own workspace, so the root workspace's build, tests and
# `cargo clippy --workspace` never see it and nothing there needs nightly.
# See CONTRIBUTING.md, "Fuzzing".
[package]
name = "arcsec-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
libfuzzer-sys = "0.4.13"
arcsec-core = { path = "../arcsec-core" }
arcsec-io = { path = "../arcsec-io" }
arcsec-catalogue = { path = "../arcsec-catalogue" }

[[bin]]
name = "image_fits"
path = "fuzz_targets/image_fits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_xisf"
path = "fuzz_targets/image_xisf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_asdf"
path = "fuzz_targets/image_asdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_tiles"
path = "fuzz_targets/catalog_tiles.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anet_index"
path = "fuzz_targets/anet_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arcsecix"
path = "fuzz_targets/arcsecix.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "solve_params"
path = "fuzz_targets/solve_params.rs"
test = false
doc = false
bench = false

[[bin]]
name = "detect"
path = "fuzz_targets/detect.rs"
test = false
doc = false
bench = false
