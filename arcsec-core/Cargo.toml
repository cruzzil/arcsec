[package]
name = "arcsec-core"
description = "Plate-solving library behind the arcsec CLI: star detection, quad matching, blind solving and WCS fitting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/arcsec-core"
readme = "README.md"
keywords = ["astronomy", "astrometry", "plate-solving", "star-catalog", "wcs"]
categories = ["science", "algorithms", "multimedia::images"]
# Only what a build needs. The README is added automatically via `readme`.
include = ["src/**/*.rs", "LICENSE"]

[lints]
workspace = true

[dependencies]
libc = "0.2"
log = { workspace = true }
memmap2 = "0.9.11"
rsfitsio = "0.470.2"

