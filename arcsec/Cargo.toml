[package]
name = "arcsec"
description = "Astrometric plate solver: find where a telescope was pointing from an image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://github.com/cruzzil/arcsec/tree/main/docs"
readme = "../README.md"
keywords = ["astronomy", "astrometry", "plate-solving", "fits", "wcs"]
categories = ["science", "command-line-utilities", "multimedia::images"]
# Only what a build needs. The README is added automatically via `readme`.
include = ["src/**/*.rs", "LICENSE"]

[lints]
workspace = true

[dependencies]
clap = "4.6.7"
env_logger = { workspace = true }
log = { workspace = true }
arcsec-core = { workspace = true }
rsfitsio = "0.470.2"
bytemuck = "1.25"
libc = "0.2"
ureq = "3.4.2"
zip = "8.6.0"
tar = "0.4.46"
lzma-rs = "0.3.0"
xisf = "0.5.1"
asdf-rs = "0.2.1"

