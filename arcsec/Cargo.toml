[package]
name = "arcsec"
description = "Astrometric plate solver: find where a telescope was pointing from an image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/cruzzil/arcsec/tree/main/docs"
readme = "../README.md"
keywords = ["astronomy", "astrometry", "plate-solving", "fits", "wcs"]
categories = ["science", "command-line-utilities", "multimedia::images"]
# Only what a build needs. The README is added automatically via `readme`.
include = ["src/**/*.rs", "build.rs", "LICENSE"]

[lints]
workspace = true

[dependencies]
clap = "4.6.7"
env_logger = { workspace = true }
log = { workspace = true }
arcsec-core = { workspace = true }
arcsec-io = { workspace = true }
arcsec-catalogue = { workspace = true }
# Signal handling while an index is written (catalog_cmd/index_cmd.rs).
libc = "0.2"

[dev-dependencies]
arcsec-catalogue = { workspace = true, features = ["test-support"] }

# Gives arcsec.exe a Windows version resource; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
