# Pinned so local builds and CI agree. They did not: a clippy lint added in
# 1.98 (chunks_exact_to_as_chunks) failed CI while the local toolchain was
# 1.97.1 and had no such lint, so it could not be reproduced before pushing.
# rustup installs this automatically on the first cargo invocation.
#
# Bump deliberately, and run `cargo clippy --all-targets -- -D warnings`
# afterwards: each release adds lints, and CI treats them as errors.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
